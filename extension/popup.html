<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH Browser Controller</title>
  <style>
    body { width: 430px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: #1f2937; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    .status { margin-bottom: 12px; padding: 8px 10px; border-radius: 6px; background: #f3f4f6; }
    .tab { padding: 10px 0; border-top: 1px solid #e5e7eb; }
    .title { font-weight: 600; word-break: break-word; }
    .url { margin: 3px 0 8px; color: #6b7280; font-size: 11px; word-break: break-all; }
    button { border: 0; border-radius: 5px; padding: 6px 10px; color: white; background: #1769aa; cursor: pointer; }
    button.release { background: #9b2c2c; }
    button.secondary { color: #1f2937; background: #e5e7eb; }
    .error { color: #9b2c2c; white-space: pre-wrap; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
    .settings { border: 1px solid #e5e7eb; border-radius: 6px; padding: 9px; margin-bottom: 10px; }
    .settings p { margin: 6px 0 9px; }
    .hint { color: #6b7280; font-size: 11px; }
  </style>
</head>
<body>
  <h1>DSH Browser Controller</h1>
  <div id="status" class="status">正在检查 Native Host…</div>
  <div class="settings">
    <strong>网站访问权限由浏览器管理</strong>
    <p>在 Edge/Chrome 扩展管理页打开本扩展的“详细信息”，通过“网站访问权限”选择“单击时”“在特定站点上”或“在所有站点上”。要添加站点，请选择“在特定站点上”并使用浏览器的“添加站点”。</p>
    <p class="hint">配置后在这里启用控制器。只有浏览器当前允许的 HTTP/HTTPS 页面才会列出或接管；即使选择“所有站点”，仍需先接管具体标签。</p>
    <button id="toggleAccess">启用控制器</button>
  </div>
  <div class="toolbar">
    <button id="refresh" class="secondary">刷新</button>
    <button id="releaseAll" class="release">释放全部</button>
  </div>
  <div id="error" class="error"></div>
  <div id="tabs"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
